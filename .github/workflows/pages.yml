name: Deploy GitHub Pages

on:
  push:
    branches: [claude/deploy-html-page-sdarke]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que index.html est à jour
        run: |
          python3 build.py
          git diff --exit-code index.html \
            || { echo "::error::index.html n'est pas à jour — lancez 'python3 build.py' et committez le résultat."; exit 1; }

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html .nojekyll site.webmanifest _site/
          cp favicon.ico favicon-16x16.png favicon-32x32.png _site/
          cp apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
