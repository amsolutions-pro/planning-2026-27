name: PRONOTE — actualités

# Interroge PRONOTE, classe les nouveautés et committe pronote/actualites.json
# (chiffré) si quelque chose a changé, puis redéploie le site.
on:
  schedule:
    # Toutes les deux heures, du lundi au samedi. Le cron est en UTC : selon la
    # saison, ces heures tombent de 6 h à 18 h ou de 7 h à 19 h à Paris. C'est
    # `--heures-ouvrees` qui tient la promesse « rien avant 7 h ni après 18 h »,
    # la seule à connaître le fuseau ; un lancement à la main passe outre.
    - cron: "0 5,7,9,11,13,15,17 * * 1-6"
  workflow_dispatch:
  # Le bouton « Vu » de la page appelle l'API GitHub, qui déclenche ceci avec
  # les identifiants à passer en « lu » sur PRONOTE.
  repository_dispatch:
    types: [pronote-lu]

permissions:
  contents: write
  actions: write

concurrency:
  group: pronote
  cancel-in-progress: false

jobs:
  actualites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pronote/requirements.txt

      - run: pip install -r pronote/requirements.txt

      - name: Interroger PRONOTE
        id: fetch
        env:
          PRONOTE_TOKEN_JSON: ${{ secrets.PRONOTE_TOKEN_JSON }}
          PRONOTE_URL: ${{ secrets.PRONOTE_URL }}
          PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
          PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}
          PRONOTE_PIN: ${{ secrets.PRONOTE_PIN }}
          PRONOTE_CLIENT_ID: ${{ secrets.PRONOTE_CLIENT_ID }}
          PRONOTE_DEVICE_NAME: ${{ secrets.PRONOTE_DEVICE_NAME }}
          PRONOTE_SITE_PASSPHRASE: ${{ secrets.PRONOTE_SITE_PASSPHRASE }}
          PRONOTE_TOKEN_SORTIE: ${{ runner.temp }}/pronote-jeton.json
          # Passe par l'environnement, jamais par la ligne de commande : le
          # contenu vient du dehors, et le script le filtre lui-même.
          IDS_LUS: ${{ github.event.client_payload.ids }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ -z "$PRONOTE_SITE_PASSPHRASE" ]; then
            echo "::warning::PRONOTE_SITE_PASSPHRASE absent : le fichier sera publié en clair sur un dépôt public."
          fi
          options=()
          [ "$EVENEMENT" = schedule ] && options+=(--heures-ouvrees)
          [ -n "$IDS_LUS" ] && options+=(--marquer-lu "$IDS_LUS")
          code=0
          python3 pronote/fetch.py "${options[@]}" || code=$?
          if [ -f "$PRONOTE_TOKEN_SORTIE" ]; then echo "jeton=true" >> "$GITHUB_OUTPUT"; fi
          exit $code

      # Le jeton d'application mobile change à chaque connexion : on remet le
      # nouveau dans le secret, sinon la prochaine connexion échoue.
      - name: Faire tourner le jeton
        if: always() && steps.fetch.outputs.jeton == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRONOTE_SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Nouveau jeton reçu mais PRONOTE_SECRETS_PAT absent : impossible de mettre à jour PRONOTE_TOKEN_JSON (voir README)."
            exit 1
          fi
          gh secret set PRONOTE_TOKEN_JSON --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/pronote-jeton.json"
          rm -f "$RUNNER_TEMP/pronote-jeton.json"

      - name: Committer si quelque chose a changé
        id: commit
        if: steps.fetch.outputs.change == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pronote/actualites.json
          git commit -m "Met à jour les actualités PRONOTE"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "pousse=true" >> "$GITHUB_OUTPUT"

      # Un push fait avec GITHUB_TOKEN ne déclenche pas les autres workflows :
      # on lance le déploiement Pages explicitement.
      - name: Redéployer le site
        if: steps.commit.outputs.pousse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
